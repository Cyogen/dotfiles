# ╔═══════════════════════════════════════════════════════╗
# ║         CYBERPUNK KITTY — NEON GRID EDITION           ║
# ╚═══════════════════════════════════════════════════════╝

# ── Font ──────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0

# Ligatures
disable_ligatures never

# ── Transparency & Background ──────────────────────────────
background_opacity         0.82
background_blur            32
dynamic_background_opacity yes

# ── Cursor ────────────────────────────────────────────────
cursor                  #b450ff
cursor_text_color       #0a0a12
cursor_shape            block
cursor_blink_interval   0.6
cursor_stop_blinking_after 0

# ── Scrollback ────────────────────────────────────────────
scrollback_lines         10000
scrollback_pager_history_size 0

# ── Mouse ─────────────────────────────────────────────────
mouse_hide_wait    3.0
focus_follows_mouse yes

# ── Window ────────────────────────────────────────────────
window_padding_width        2 4
single_window_margin_width  -1
placement_strategy          center
hide_window_decorations     yes
resize_debounce_time        0.1
draw_minimal_borders        yes
window_border_width         1.5pt
active_border_color         #b450ff
inactive_border_color       #2a1a3a
bell_border_color           #ff1744

# ── Tab bar ───────────────────────────────────────────────
tab_bar_edge              bottom
tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          2
tab_bar_margin_width      0
tab_title_template        " {index}: {title} "
active_tab_title_template " {index}: {title} "
active_tab_font_style     bold
inactive_tab_font_style   normal
tab_bar_background        #0a0a12
active_tab_foreground     #e0a0ff
active_tab_background     #2a0a4a
inactive_tab_foreground   #4a3a5a
inactive_tab_background   #0f0f1a

# ── Color Scheme — Cyberpunk Neon Grid ────────────────────
background            #0a0a12
foreground            #00ff41
selection_background  #2a1a4a
selection_foreground  #e0a0ff

# Black
color0  #0f0f1a
color8  #2a2a3a

# Red
color1  #ff1744
color9  #ff5570

# Green
color2  #00e676
color10 #40ff90

# Yellow
color3  #ffd600
color11 #ffff40

# Blue (purple in our scheme)
color4  #7030aa
color12 #b450ff

# Magenta
color5  #e040fb
color13 #ea80ff

# Cyan
color6  #00e5ff
color14 #80f0ff

# White
color7  #c8d8e8
color15 #ffffff

# ── URL styling ───────────────────────────────────────────
url_color           #b450ff
url_style           curly
open_url_with       default
detect_urls         yes

# ── Marks ─────────────────────────────────────────────────
mark1_foreground #0a0a12
mark1_background #b450ff
mark2_foreground #0a0a12
mark2_background #e040fb
mark3_foreground #0a0a12
mark3_background #00e676

# ── Bell ──────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0

# ── Performance ───────────────────────────────────────────
repaint_delay    8
input_delay      2
sync_to_monitor  yes

# ── Shell ─────────────────────────────────────────────────
shell_integration enabled
